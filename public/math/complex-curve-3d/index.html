<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complex Curve Visualization</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #c8c8d0;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100vh;
  }

  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  canvas { display: block; }

  .controls {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(10,10,18,0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 300px;
    z-index: 10;
  }

  .controls h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
    font-size: 18px;
    color: #e8e8f0;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .controls .subtitle {
    font-size: 11px;
    color: #666;
    margin-bottom: 16px;
    font-weight: 300;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 6px;
  }

  .field select, .field input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #ddd;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field select:focus, .field input:focus {
    border-color: rgba(120,140,255,0.4);
  }

  .field select option {
    background: #16161e;
  }

  .legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 11px;
    z-index: 10;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .legend-item:last-child { margin-bottom: 0; }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .info {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 11px;
    color: #777;
    z-index: 10;
    max-width: 220px;
    line-height: 1.5;
  }

  .formula-display {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 15px;
    color: #b0b0d0;
    padding: 8px 0 4px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 8px;
  }
</style>
<script>
const i18n = {
  en: {
    subtitle: "Complex-valued function of a real variable",
    curveLabel: "Curve γ(t)",
    legend3d: "3D curve (t, Re, Im)",
    legendShadowC: "Shadow on ℂ-plane (Re, Im)",
    legendShadowRe: "Shadow on (t, Re)",
    legendShadowIm: "Shadow on (t, Im)",
    infoLine1: "Drag to rotate · Scroll to zoom",
    infoLine2: 'The <em>t</em>-axis goes "into" the screen; Re and Im form the other two axes.'
  },
  he: {
    subtitle: "פונקציה מרוכבת של משתנה ממשי",
    curveLabel: "עקומה γ(t)",
    legend3d: "עקומה תלת-ממדית (t, Re, Im)",
    legendShadowC: "הטלה על מישור ℂ (Re, Im)",
    legendShadowRe: "הטלה על (t, Re)",
    legendShadowIm: "הטלה על (t, Im)",
    infoLine1: "גרור לסיבוב · גלול לזום",
    infoLine2: 'ציר <em>t</em> נכנס "לתוך" המסך; Re ו-Im יוצרים את שני הצירים האחרים.'
  },
  ar: {
    subtitle: "دالة مركّبة لمتغير حقيقي",
    curveLabel: "المنحنى γ(t)",
    legend3d: "منحنى ثلاثي الأبعاد (t, Re, Im)",
    legendShadowC: "ظل على مستوى ℂ (Re, Im)",
    legendShadowRe: "ظل على (t, Re)",
    legendShadowIm: "ظل على (t, Im)",
    infoLine1: "اسحب للتدوير · مرر للتكبير",
    infoLine2: 'محور <em>t</em> يدخل "في" الشاشة؛ Re وIm يشكلان المحورين الآخرين.'
  }
};
let currentLang = 'en';
function t(key) { return i18n[currentLang][key]; }
</script>
</head>
<body>

<div id="canvas-container"></div>

<div class="controls">
  <h1>γ : [a, b] → ℂ</h1>
  <div class="subtitle" id="i18n-subtitle">Complex-valued function of a real variable</div>

  <div class="field">
    <label id="i18n-curve-label">Curve γ(t)</label>
    <select id="curve-select">
      <option value="helix">e^(it) — unit circle</option>
      <option value="spiral">e^(−t/4) · e^(3it) — decaying spiral</option>
      <option value="lissajous">cos(2t) + i·sin(3t) — Lissajous</option>
      <option value="cardioid">(1−cos t)·e^(it) — cardioid</option>
      <option value="line">(1−t)·z₀ + t·z₁ — line segment</option>
      <option value="custom">Custom</option>
    </select>
  </div>

  <div class="field" id="custom-field" style="display:none;">
    <label>Re(γ(t)), Im(γ(t))</label>
    <input id="custom-re" type="text" placeholder="cos(2*t)" value="cos(2*t)">
    <input id="custom-im" type="text" placeholder="sin(3*t)" value="sin(3*t)" style="margin-top:4px;">
  </div>

  <div class="field" style="display:flex; gap:8px;">
    <div style="flex:1">
      <label>a</label>
      <input id="param-a" type="number" value="0" step="0.1">
    </div>
    <div style="flex:1">
      <label>b</label>
      <input id="param-b" type="number" value="6.2832" step="0.1">
    </div>
  </div>

  <div class="formula-display" id="formula"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b8a;"></div><span id="i18n-legend-3d">3D curve (t, Re, Im)</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:rgba(100,140,255,0.5);"></div><span id="i18n-legend-c">Shadow on ℂ-plane (Re, Im)</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:rgba(255,180,100,0.4);"></div><span id="i18n-legend-re">Shadow on (t, Re)</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:rgba(100,255,160,0.4);"></div><span id="i18n-legend-im">Shadow on (t, Im)</span></div>
</div>

<div class="info" id="i18n-info">
  Drag to rotate · Scroll to zoom<br>
  The <em>t</em>-axis goes "into" the screen; Re and Im form the other two axes.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene setup ──
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4, 3, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0f);
container.appendChild(renderer.domElement);

// ── Orbit controls (manual) ──
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.8, phi: 1.0, r: 7 };

function updateCamera() {
  camera.position.x = spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.position.y = spherical.r * Math.cos(spherical.phi);
  camera.position.z = spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('pointerdown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', () => isDragging = false);
renderer.domElement.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  spherical.theta -= dx * 0.005;
  spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy * 0.005));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  spherical.r = Math.max(2, Math.min(20, spherical.r + e.deltaY * 0.005));
  updateCamera();
});

// ── Axes ──
const axisLen = 3;
function makeAxis(dir, color) {
  const mat = new THREE.LineBasicMaterial({ color });
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(dir[0]*axisLen, dir[1]*axisLen, dir[2]*axisLen)
  ]);
  scene.add(new THREE.Line(geo, mat));

  // negative side, dimmer
  const geo2 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(-dir[0]*axisLen*0.3, -dir[1]*axisLen*0.3, -dir[2]*axisLen*0.3)
  ]);
  const mat2 = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.2 });
  scene.add(new THREE.Line(geo2, mat2));
}

// t → Z axis, Re → X axis, Im → Y axis
makeAxis([0,0,1], 0x888888); // t
makeAxis([1,0,0], 0x6488ff); // Re
makeAxis([0,1,0], 0x64ffaa); // Im

// Axis labels using sprites
function makeLabel(text, pos, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'italic 36px serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, 64, 44);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.position.set(...pos);
  sprite.scale.set(0.8, 0.4, 1);
  scene.add(sprite);
}

makeLabel('t', [0, -0.2, axisLen + 0.3], '#aaa');
makeLabel('Re', [axisLen + 0.3, -0.2, 0], '#6488ff');
makeLabel('Im', [-0.2, axisLen + 0.3, 0], '#64ffaa');

// ── Grid on the complex plane (Re-Im at t=0) ──
const gridHelper = new THREE.GridHelper(6, 12, 0x1a1a2e, 0x1a1a2e);
gridHelper.rotation.x = Math.PI / 2;
// Grid is on XZ by default; we rotate it to XY
gridHelper.rotation.x = 0; // XZ plane
gridHelper.rotation.z = 0;
// Actually we want grid on XY plane (Re, Im)
// GridHelper is on XZ, we need to rotate to XY
gridHelper.rotation.x = Math.PI / 2;
scene.add(gridHelper);

// ── Curve definitions ──
const curves = {
  helix: (t) => [Math.cos(t), Math.sin(t)],
  spiral: (t) => [Math.exp(-t/4)*Math.cos(3*t), Math.exp(-t/4)*Math.sin(3*t)],
  lissajous: (t) => [Math.cos(2*t), Math.sin(3*t)],
  cardioid: (t) => [(1-Math.cos(t))*Math.cos(t), (1-Math.cos(t))*Math.sin(t)],
  line: (t) => {
    const a_ = parseFloat(document.getElementById('param-a').value) || 0;
    const b_ = parseFloat(document.getElementById('param-b').value) || 1;
    const s = (t - a_) / (b_ - a_);
    return [-1 + s*3, 0.5 + s*1.5];
  }
};

const formulas = {
  helix: 'γ(t) = e^{it} = cos t + i sin t',
  spiral: 'γ(t) = e^{−t/4} · e^{3it}',
  lissajous: 'γ(t) = cos 2t + i sin 3t',
  cardioid: 'γ(t) = (1−cos t) · e^{it}',
  line: 'γ(t) = (1−s)·(−1+½i) + s·(2+2i)',
  custom: 'γ(t) = custom'
};

let curveGroup = new THREE.Group();
scene.add(curveGroup);

function safeMath(expr, t) {
  try {
    const fn = new Function('t',
      'const sin=Math.sin,cos=Math.cos,tan=Math.tan,exp=Math.exp,log=Math.log,sqrt=Math.sqrt,abs=Math.abs,PI=Math.PI,pi=Math.PI;' +
      'return (' + expr + ');'
    );
    const v = fn(t);
    return isFinite(v) ? v : 0;
  } catch { return 0; }
}

function buildCurve() {
  // Clear old
  while (curveGroup.children.length) curveGroup.remove(curveGroup.children[0]);

  const sel = document.getElementById('curve-select').value;
  const a = parseFloat(document.getElementById('param-a').value) || 0;
  const b = parseFloat(document.getElementById('param-b').value) || 6.2832;
  const N = 500;

  document.getElementById('formula').textContent = formulas[sel] || '';

  let fn;
  if (sel === 'custom') {
    const reExpr = document.getElementById('custom-re').value || '0';
    const imExpr = document.getElementById('custom-im').value || '0';
    fn = (t) => [safeMath(reExpr, t), safeMath(imExpr, t)];
    document.getElementById('formula').textContent = 'γ(t) = (' + reExpr + ') + i(' + imExpr + ')';
  } else {
    fn = curves[sel];
  }

  const pts3d = [];
  const ptsShadowXY = []; // complex plane shadow (Re, Im)
  const ptsShadowXZ = []; // (t, Re)
  const ptsShadowYZ = []; // (t, Im)

  // Normalize t to fit in a reasonable visual range
  const tScale = axisLen / Math.max(Math.abs(b - a), 0.001);

  for (let i = 0; i <= N; i++) {
    const t = a + (b - a) * i / N;
    const [re, im] = fn(t);
    const tz = (t - a) * tScale;

    pts3d.push(new THREE.Vector3(re, im, tz));
    ptsShadowXY.push(new THREE.Vector3(re, im, 0));
    ptsShadowXZ.push(new THREE.Vector3(re, 0, tz));
    ptsShadowYZ.push(new THREE.Vector3(0, im, tz));
  }

  // Main 3D curve — gradient colored
  const mainGeo = new THREE.BufferGeometry().setFromPoints(pts3d);
  const colors = new Float32Array(pts3d.length * 3);
  for (let i = 0; i < pts3d.length; i++) {
    const s = i / pts3d.length;
    // warm gradient: pink → orange → gold
    colors[i*3]   = 1.0;
    colors[i*3+1] = 0.4 + s * 0.4;
    colors[i*3+2] = 0.54 - s * 0.2;
  }
  mainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mainMat = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2 });
  curveGroup.add(new THREE.Line(mainGeo, mainMat));

  // Shadows
  const shadowXY = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(ptsShadowXY),
    new THREE.LineBasicMaterial({ color: 0x6488ff, transparent: true, opacity: 0.3 })
  );
  curveGroup.add(shadowXY);

  const shadowXZ = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(ptsShadowXZ),
    new THREE.LineBasicMaterial({ color: 0xffb464, transparent: true, opacity: 0.25 })
  );
  curveGroup.add(shadowXZ);

  const shadowYZ = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(ptsShadowYZ),
    new THREE.LineBasicMaterial({ color: 0x64ffa0, transparent: true, opacity: 0.25 })
  );
  curveGroup.add(shadowYZ);

  // "Curtain" lines connecting curve to complex-plane shadow
  for (let i = 0; i <= N; i += 10) {
    const geo = new THREE.BufferGeometry().setFromPoints([pts3d[i], ptsShadowXY[i]]);
    const mat = new THREE.LineBasicMaterial({ color: 0x6488ff, transparent: true, opacity: 0.07 });
    curveGroup.add(new THREE.Line(geo, mat));
  }

  // Start / end markers
  const dotGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const startDot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0x44ff88 }));
  startDot.position.copy(pts3d[0]);
  curveGroup.add(startDot);

  const endDot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0xff4466 }));
  endDot.position.copy(pts3d[pts3d.length - 1]);
  curveGroup.add(endDot);
}

// ── Events ──
document.getElementById('curve-select').addEventListener('change', function() {
  document.getElementById('custom-field').style.display = this.value === 'custom' ? 'block' : 'none';
  buildCurve();
});
document.getElementById('param-a').addEventListener('change', buildCurve);
document.getElementById('param-b').addEventListener('change', buildCurve);
document.getElementById('custom-re').addEventListener('change', buildCurve);
document.getElementById('custom-im').addEventListener('change', buildCurve);

buildCurve();

// ── Animate ──
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Settings gear with language dropdown
(function() {
    const style = document.createElement('style');
    style.textContent = `
      .lang-settings-btn { position:fixed; top:12px; right:12px; z-index:9999; width:36px; height:36px; border-radius:50%; background:rgba(10,10,18,0.88); border:1px solid rgba(255,255,255,0.1); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.3); backdrop-filter:blur(12px); transition:background 0.2s, transform 0.2s; }
      .lang-settings-btn:hover { background:rgba(20,20,30,0.95); transform:scale(1.08); }
      .lang-settings-btn svg { width:18px; height:18px; fill:#999; }
      .lang-dropdown { position:fixed; top:54px; right:12px; z-index:9999; background:rgba(10,10,18,0.92); border:1px solid rgba(255,255,255,0.08); border-radius:10px; backdrop-filter:blur(12px); box-shadow:0 4px 16px rgba(0,0,0,0.4); padding:6px 0; min-width:160px; opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity 0.2s, transform 0.2s; }
      .lang-dropdown.open { opacity:1; transform:translateY(0); pointer-events:auto; }
      .lang-dropdown-header { padding:6px 14px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:#666; font-family:'JetBrains Mono',monospace; }
      .lang-option { display:flex; align-items:center; gap:8px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:400; color:#ccc; transition:background 0.15s; border:none; background:none; width:100%; text-align:left; font-family:'JetBrains Mono',monospace; }
      .lang-option:hover { background:rgba(255,255,255,0.06); }
      .lang-option.active { color:#7c9aff; font-weight:500; }
      .lang-option .check { width:16px; font-size:14px; }
    `;
    document.head.appendChild(style);

    const gearBtn = document.createElement('button');
    gearBtn.className = 'lang-settings-btn';
    gearBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>';
    document.body.appendChild(gearBtn);

    const dropdown = document.createElement('div');
    dropdown.className = 'lang-dropdown';
    dropdown.innerHTML = `
      <div class="lang-dropdown-header">Language</div>
      <button class="lang-option active" data-lang="en"><span class="check">✓</span> English</button>
      <button class="lang-option" data-lang="he"><span class="check"></span> עברית</button>
      <button class="lang-option" data-lang="ar"><span class="check"></span> العربية</button>
    `;
    document.body.appendChild(dropdown);

    gearBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('open'); });
    document.addEventListener('click', () => dropdown.classList.remove('open'));
    dropdown.addEventListener('click', (e) => e.stopPropagation());

    dropdown.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', () => {
            const lang = opt.dataset.lang;
            currentLang = lang;
            const isRTL = (lang === 'he' || lang === 'ar');
            document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
            gearBtn.style.right = isRTL ? '' : '12px';
            gearBtn.style.left = isRTL ? '12px' : '';
            dropdown.style.right = isRTL ? '' : '12px';
            dropdown.style.left = isRTL ? '12px' : '';
            dropdown.querySelectorAll('.lang-option').forEach(o => { o.classList.remove('active'); o.querySelector('.check').textContent = ''; });
            opt.classList.add('active');
            opt.querySelector('.check').textContent = '✓';
            // Update UI text
            document.getElementById('i18n-subtitle').textContent = t('subtitle');
            document.getElementById('i18n-curve-label').textContent = t('curveLabel');
            document.getElementById('i18n-legend-3d').textContent = t('legend3d');
            document.getElementById('i18n-legend-c').textContent = t('legendShadowC');
            document.getElementById('i18n-legend-re').textContent = t('legendShadowRe');
            document.getElementById('i18n-legend-im').textContent = t('legendShadowIm');
            document.getElementById('i18n-info').innerHTML = t('infoLine1') + '<br>' + t('infoLine2');
